<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FlexiPay</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-dark bg-primary mb-4">
    <div class="container">
      <span class="navbar-brand">FlexiPay</span>
    </div>
  </nav>
  <div class="container">
    <h1 class="mb-4">User Info</h1>
    <p><strong>Username:</strong> {{ user.username }}</p>
    <p><strong>Email:</strong> {{ user.email }}</p>
    <p><strong>Balance:</strong> {{ user.balance }} NIS</p>
  </div>
  <div class="container">
    <h2>My recharge requests</h2>
    <table class="table table-striped">
      <tr><th>Meter</th><th>Amount</th><th>Status</th></tr>
        <tr>
          <td>{{ r.meter }}</td>
          <td>{{ r.amount }} NIS</td>
          <td>{{ r.status }}</td>
        </tr>
    </table>
  </div>
</body>
</html>
